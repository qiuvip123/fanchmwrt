name: Build A31+Mesh

on:
  push:
    branches: [ fanchmwrt-25.12.6 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-ply python3-pyelftools \
            python3-docutils rsync swig unzip zlib1g-dev file wget cpio bc time

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "--- mesh feed check ---"
          ls feeds/ 2>/dev/null | grep -i mesh || echo "NO-MESH-FEED-DIR"
          ls feeds/mesh/ 2>/dev/null || echo "NO-MESH-PACKAGES"

      - name: Ensure luci-app-mesh available (feed fallback)
        run: |
          if [ ! -d feeds/mesh/luci-app-mesh ] && [ ! -d package/luci-app-mesh ]; then
            echo "mesh feed not installed, cloning into tree..."
            git clone --depth 1 https://github.com/xxosdev/luci-app-mesh.git package/luci-app-mesh
          else
            echo "luci-app-mesh already available via feed/tree"
          fi
          ls -d package/luci-app-mesh feeds/mesh/luci-app-mesh 2>/dev/null || { echo "luci-app-mesh STILL MISSING"; exit 1; }

      - name: Configure (Konka A31 + luci-app-mesh)
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_konka_komi-a31=y
          CONFIG_PACKAGE_luci-app-mesh=y
          CONFIG_PACKAGE_wpad-mesh-openssl=y
          CONFIG_PACKAGE_kmod-batman-adv=y
          CONFIG_PACKAGE_batctl=y
          CONFIG_PACKAGE_luci-proto-batman-adv=y
          CONFIG_PACKAGE_dawn=y
          CONFIG_PACKAGE_umdns=y
          EOF
          make defconfig
          echo "--- config check ---"
          grep -E 'CONFIG_PACKAGE_luci-app-mesh|CONFIG_PACKAGE_wpad-mesh|CONFIG_PACKAGE_kmod-batman-adv|CONFIG_TARGET_mediatek_filogic_DEVICE_konka' .config || true

      - name: Verify luci-app-mesh selected
        run: |
          grep -q '^CONFIG_PACKAGE_luci-app-mesh=y$' .config && echo "luci-app-mesh SELECTED OK" || { echo "luci-app-mesh NOT SELECTED - abort"; exit 1; }

      - name: Build
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: List artifacts
        run: |
          ls -lh bin/targets/mediatek/filogic/
          echo '--- mesh/batman in targets ---'
          find bin/targets -iname '*mesh*' -o -iname '*batman*' | head -50
          echo '--- mesh in feed packages ---'
          find bin/packages -iname '*mesh*' | head -20

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-a31-mesh
          path: |
            bin/targets/mediatek/filogic/*
            bin/packages/**/*mesh*
            build.log
            .config
