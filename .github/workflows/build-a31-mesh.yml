name: Build A31+Mesh

on:
  push:
    branches: [ fanchmwrt-25.12.6 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-ply python3-pyelftools \
            python3-docutils rsync swig unzip zlib1g-dev file wget cpio bc time

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add luci-app-mesh into tree (codeload tarball)
        run: |
          set -e
          curl -sSL -o /tmp/mesh.tgz https://codeload.github.com/xxosdev/luci-app-mesh/tar.gz/997e76e5734ba78cc6fda6f4e888e5d09649e9e1
          ls -lh /tmp/mesh.tgz
          mkdir -p package/luci-app-mesh
          tar -xzf /tmp/mesh.tgz --strip-components=1 -C package/luci-app-mesh
          ls -la package/luci-app-mesh/
          test -f package/luci-app-mesh/Makefile && echo "Makefile OK" || { echo "NO MAKEFILE"; exit 1; }

      - name: Configure (Konka A31 + luci-app-mesh)
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_konka_komi-a31=y
          CONFIG_PACKAGE_luci-app-mesh=y
          CONFIG_PACKAGE_wpad-mesh-openssl=y
          CONFIG_PACKAGE_kmod-batman-adv=y
          CONFIG_PACKAGE_batctl=y
          CONFIG_PACKAGE_luci-proto-batman-adv=y
          CONFIG_PACKAGE_dawn=y
          CONFIG_PACKAGE_umdns=y
          EOF
          make defconfig 2>&1 | tee config.log
          echo "--- config check ---"
          grep -E '^CONFIG_PACKAGE_luci-app-mesh|^CONFIG_PACKAGE_wpad-mesh|^CONFIG_PACKAGE_kmod-batman-adv|^CONFIG_TARGET_mediatek_filogic_DEVICE_konka' .config || true

      - name: Verify luci-app-mesh selected
        run: |
          if grep -q '^CONFIG_PACKAGE_luci-app-mesh=y$' .config; then
            echo "luci-app-mesh SELECTED OK"
          else
            echo "luci-app-mesh NOT SELECTED - abort"
            grep -i -C2 'luci-app-mesh' config.log || true
            exit 1
          fi

      - name: Build
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: List artifacts
        run: |
          ls -lh bin/targets/mediatek/filogic/
          echo '--- mesh in targets ---'
          find bin/targets -iname '*mesh*' | head -50
          echo '--- mesh in feed packages ---'
          find bin/packages -iname '*mesh*' | head -20

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-a31-mesh
          path: |
            bin/targets/mediatek/filogic/*
            bin/packages/**/*mesh*
            build.log
            config.log
            .config

      - name: Upload diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a31-mesh-diagnostics
          path: |
            build.log
            config.log
            .config
          if-no-files-found: ignore
